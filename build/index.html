6e7a;margin-bottom:1.5rem">Подготовка волшебного домика для вас</p><div style="width:60px;height:60px;border:5px solid #e0e0e0;border-top:5px solid #0288d1;border-radius:50%;margin:0 auto;animation:spin 1s linear infinite"></div></div></div></div><script>const style=document.createElement("style");style.textContent="\n        @keyframes spin {\n          0% { transform: rotate(0deg); }\n          100% { transform: rotate(360deg); }\n        }\n        @keyframes pulse {\n          0% { opacity: 0.5; }\n          50% { opacity: 1; }\n          100% { opacity: 0.5; }\n        }\n      ",document.head.appendChild(style)</script></body></html>
